name: docs-check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  docs-check:
    name: Structural docs check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check docs structure
        run: node tests/check-docs.mjs
