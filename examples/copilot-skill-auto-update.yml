# Copy this file into YOUR repository's .github/workflows/ directory to keep
# project-scope agent skills (the ones committed under .agents/skills/,
# .github/skills/, or .claude/skills/) automatically up to date.
#
# Weekly, it runs `gh skill update --all` and opens a pull request when any
# skill has a new tagged release upstream. Pinned skills are skipped by
# design. Requires the runner's GitHub CLI to be v2.90+ (GitHub-hosted
# runners track recent releases).
name: update-agent-skills

on:
  schedule:
    - cron: '17 6 * * 1' # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update installed skills
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh skill update --all

      - name: Open PR if anything changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            echo "All skills already at their latest release."
            exit 0
          fi
          BRANCH="chore/update-agent-skills-$(date -u +%Y%m%d)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "chore: update agent skills to latest releases"
          git push -u origin "$BRANCH"
          gh pr create \
            --title "chore: update agent skills" \
            --body "Automated weekly \`gh skill update --all\`. Review the diff and merge to adopt the new skill versions."
